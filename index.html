<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UBG Alphabet</title>

<style>
	* {
		box-sizing: border-box;
	}

	body {
		margin: 0;
		min-height: 100vh;
		background: #000;
		color: #fff;
		font-family: Arial, Helvetica, sans-serif;
		display: flex;
		justify-content: center;
		align-items: center;
		padding: 24px;
	}

	.container {
		width: 100%;
		max-width: 760px;
	}

	.label {
		font-size: 13px;
		color: #888;
		margin-bottom: 8px;
	}

	.alphabet {
		width: 100%;
		padding: 18px;
		background: #111;
		border: 1px solid #252525;
		border-radius: 12px;
		font-size: 18px;
		line-height: 1.8;
		word-break: break-word;
		margin-bottom: 18px;
	}

	.input-wrapper {
		position: relative;
	}

	textarea {
		position: relative;
		z-index: 2;
		width: 100%;
		min-height: 150px;
		resize: vertical;
		padding: 18px;
		border: 1px solid #252525;
		border-radius: 12px;
		background: transparent;
		color: #fff;
		font: inherit;
		font-size: 18px;
		line-height: 1.5;
		outline: none;
		caret-color: #fff;
		transition: border-color 0.2s ease, box-shadow 0.2s ease;
	}

	textarea:focus {
		border-color: #555;
		box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.04);
	}

	textarea::placeholder {
		color: #555;
	}

	.ghost {
		position: absolute;
		z-index: 1;
		top: 18px;
		left: 18px;
		right: 18px;
		bottom: 18px;
		color: #fff;
		font: inherit;
		font-size: 18px;
		line-height: 1.5;
		white-space: pre-wrap;
		word-wrap: break-word;
		overflow: hidden;
		pointer-events: none;
	}

	.ghost-text {
		color: rgba(255, 255, 255, 0.22);
	}

	.ghost-text:nth-of-type(2) {
		color: rgba(255, 255, 255, 0.14);
	}

	.ghost-text:nth-of-type(3) {
		color: rgba(255, 255, 255, 0.08);
	}

	.ghost-text:nth-of-type(4) {
		color: rgba(255, 255, 255, 0.04);
	}

	.output {
		width: 100%;
		min-height: 110px;
		margin-top: 14px;
		padding: 18px;
		border: 1px solid #252525;
		border-radius: 12px;
		background: #111;
		color: #fff;
		font-size: 15px;
		line-height: 1.6;
		word-break: break-all;
	}

	.copy {
		width: 100%;
		margin-top: 10px;
		padding: 13px;
		border: 0;
		border-radius: 10px;
		background: #fff;
		color: #000;
		font-weight: 700;
		font-size: 15px;
		cursor: pointer;
		transition:
			background 0.2s ease,
			transform 0.15s ease,
			box-shadow 0.2s ease;
	}

	.copy:hover {
		background: #ddd;
		box-shadow: 0 4px 14px rgba(255, 255, 255, 0.08);
	}

	.copy:active {
		transform: scale(0.98);
		box-shadow: 0 1px 6px rgba(255, 255, 255, 0.04);
	}
</style>
</head>

<body>

<div class="container">

	<div class="label">Normal alphabet</div>

	<div class="alphabet" id="currentAlphabet"></div>

	<div class="label">Custom alphabet</div>

	<div class="input-wrapper">
		<div class="ghost" id="ghost"></div>

		<textarea
			id="customAlphabet"
			placeholder="Ω (2) (3) (4) (5) ..."
			spellcheck="false"
		></textarea>
	</div>

	<div class="label" style="margin-top: 18px;">Generated code</div>

	<div class="output" id="output"></div>

	<button class="copy" id="copy">Copy</button>

</div>

<script>
const legacy = [
	"Ω", "Ψ", "Χ", "Φ", "Υ", "Τ", "Σ", "Ρ", "Π", "Ο", "Ξ", "Ν",
	"Μ", "Λ", "Κ", "Ι", "Θ", "Η", "Ζ", "Ε", "Δ", "Γ", "Β", "Α"
];

const password = "play untitled battery game today";

const currentAlphabet = document.getElementById("currentAlphabet");
const customAlphabet = document.getElementById("customAlphabet");
const ghost = document.getElementById("ghost");
const output = document.getElementById("output");
const copy = document.getElementById("copy");

currentAlphabet.textContent = legacy.join("   ");

function xor(data) {
	const result = new Uint8Array(data.length);

	for (let i = 0; i < data.length; i++) {
		const passwordByte = password.charCodeAt(i % password.length);
		result[i] = data[i] ^ passwordByte;
	}

	return result;
}

function toBase64(bytes) {
	let binary = "";

	for (const byte of bytes) {
		binary += String.fromCharCode(byte);
	}

	return btoa(binary);
}

function encodeAlphabet(alphabet) {
	const json = JSON.stringify(alphabet);
	const encoded = new TextEncoder().encode(json);
	const encrypted = xor(encoded);

	return "UBG-" + toBase64(encrypted);
}

function updateGhost() {
	const chars = customAlphabet.value.trim().split(/\s+/).filter(Boolean);
	const nextIndex = chars.length;

	ghost.innerHTML = "";

	if (nextIndex >= legacy.length) {
		return;
	}

	const text = document.createTextNode(customAlphabet.value);

	ghost.appendChild(text);

	const predictions = document.createDocumentFragment();

	for (let i = nextIndex; i < Math.min(nextIndex + 4, legacy.length); i++) {
		const span = document.createElement("span");
		span.className = "ghost-text";
		span.textContent =
			(i === nextIndex ? " " : " ") + legacy[i];

		predictions.appendChild(span);
	}

	ghost.appendChild(predictions);
}

function generate() {
	const chars = customAlphabet.value.trim().split(/\s+/).filter(Boolean);

	updateGhost();

	if (chars.length === 0) {
		output.textContent = "";
		return;
	}

	const alphabet = legacy.map((oldChar, index) => {
		return chars[index] ?? oldChar;
	});

	output.textContent = encodeAlphabet(alphabet);
}

customAlphabet.addEventListener("input", generate);

copy.addEventListener("click", async () => {
	if (!output.textContent) {
		return;
	}

	try {
		await navigator.clipboard.writeText(output.textContent);

		copy.textContent = "Copied!";

		setTimeout(() => {
			copy.textContent = "Copy";
		}, 1200);
	} catch {
		copy.textContent = "Failed";

		setTimeout(() => {
			copy.textContent = "Copy";
		}, 1200);
	}
});

updateGhost();
</script>

</body>
</html>
